name: Android CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Also build the release APK"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  GRADLE_OPTS: "-Dorg.gradle.welcome=never"

jobs:
  # ---------------------------------------------------------------------
  # 1) Birim testleri. Kendi başına koşar ve kendi başına KIRMIZI kalır.
  #    Başarısız olsa bile raporu yüklenir; sonuç asla gizlenmez.
  # ---------------------------------------------------------------------
  unit-tests:
    name: Unit tests (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4.2.2

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_COMPILE_SDK }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v4.3.4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Clean stale build outputs
        run: ./gradlew --no-daemon clean

      - name: Run unit tests
        id: tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace --info 2>&1 | tee test-output.log
          echo "exit_code=0" >> "$GITHUB_OUTPUT"

      - name: Show the failing tail in the job summary
        if: failure()
        run: |
          {
            echo "### :x: Unit tests failed — last 120 log lines"
            echo '```'
            tail -n 120 test-output.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish JUnit results to the job summary
        if: always()
        run: |
          XML_DIR=app/build/test-results/testDebugUnitTest
          if [ -d "$XML_DIR" ]; then
            python3 - "$XML_DIR" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          d = sys.argv[1]
          total = fail = err = skip = 0
          for f in glob.glob(d + "/*.xml"):
              r = ET.parse(f).getroot()
              total += int(r.get("tests", 0)); fail += int(r.get("failures", 0))
              err += int(r.get("errors", 0)); skip += int(r.get("skipped", 0))
          print("### JUnit: %d test, %d failure, %d error, %d skipped"
                % (total, fail, err, skip))
          PY
          else
            echo "### JUnit: **hiç rapor oluşmadı** — hata test gövdesinden ÖNCE bir aşamada."
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: unit-test-report-${{ github.run_number }}
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            test-output.log
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------
  # 2) Debug APK. Testlerden BAĞIMSIZ. İmzalama sırrı istemez.
  # ---------------------------------------------------------------------
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    # NOT: needs: unit-tests YOK. Test kırmızı olsa da paket üretilir ve
    # indirilebilir kalır; test sonucu yine açıkça başarısız görünür.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_COMPILE_SDK }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
      - uses: gradle/actions/setup-gradle@v4.3.4
      - run: chmod +x ./gradlew

      - name: Read application version
        id: version
        run: echo "name=$(./gradlew -q :app:printVersionName)" >> "$GITHUB_OUTPUT"

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify debug APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK" || { echo "::error::Debug APK missing: $APK"; exit 1; }
          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --print-certs "$APK"
          echo "### Debug APK v${{ steps.version.outputs.name }} — $(stat -c%s "$APK") bayt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: vexedit-studio-debug-v${{ steps.version.outputs.name }}-build${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # 3) Release APK. Sırlar eksikse İMAKSIZ üretir ve öyle adlandırır.
  # ---------------------------------------------------------------------
  release-apk:
    name: Release APK
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.build_release)
    timeout-minutes: 50
    outputs:
      version: ${{ steps.version.outputs.name }}
      signed: ${{ steps.signing.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with: { distribution: temurin, java-version: ${{ env.JAVA_VERSION }} }
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_COMPILE_SDK }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
      - uses: gradle/actions/setup-gradle@v4.3.4
      - run: chmod +x ./gradlew

      - name: Read application version
        id: version
        run: echo "name=$(./gradlew -q :app:printVersionName)" >> "$GITHUB_OUTPUT"

      - name: Resolve signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] \
             && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            mkdir -p "$RUNNER_TEMP/vexedit"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vexedit/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/vexedit/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::İmzalama sırları eksik — İMAKSIZ release APK üretilecek."
          fi

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Clean the keystore from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/vexedit"

      - name: Upload release APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: vexedit-studio-release-${{ steps.signing.outputs.enabled == 'true' && 'signed' || 'unsigned' }}-v${{ steps.version.outputs.name }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
