# Project-wide Gradle settings for VexEdit Studio.
# JVM args sized for CI runners (GitHub-hosted runners have 7 GB RAM).
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# AndroidX is required by AGP 8.x and all Jetpack/Compose dependencies.
android.useAndroidX=true

# Keep R classes non-transitive (AGP 8 default, set explicitly for reproducibility).
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
